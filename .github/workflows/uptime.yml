name: Uptime check

# Pings the live site hourly. A failing run emails the repo owner, which is the
# whole point: in Sept 2026 a bad deploy 404'd prforgd.com for two days and
# nothing raised a flag.
#
# Hourly, not every few minutes, on purpose: this is a private repo, so Actions
# minutes are metered and each run bills a full minute. Hourly is ~720/month,
# comfortably inside the free tier. For faster detection use an external
# monitor (see docs/uptime.md).

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check prforgd.com is serving the app
        run: |
          URL="https://prforgd.com"

          # Retry a few times so a transient blip doesn't cry wolf. Only a
          # sustained failure should reach your inbox.
          for attempt in 1 2 3; do
            echo "--- attempt $attempt ---"

            body="$(curl -sSL --max-time 30 "$URL" || true)"
            code="$(curl -sSL --max-time 30 -o /dev/null -w '%{http_code}' "$URL" || echo 000)"

            echo "status: $code"

            # Status alone is not enough. The Sept 2026 outage served a valid
            # response from a READY deployment that simply had no app in it, so
            # also assert the page is really the app.
            if [ "$code" = "200" ] && printf '%s' "$body" | grep -q '<title>PRForgd</title>'; then
              echo "OK: status 200 and title present"
              exit 0
            fi

            echo "check failed (status=$code, title present: $(printf '%s' "$body" | grep -c '<title>PRForgd</title>'))"
            [ "$attempt" -lt 3 ] && sleep 20
          done

          echo ""
          echo "::error::prforgd.com is not serving the app (last status: $code)."
          echo "Last response body (first 500 chars):"
          printf '%s' "$body" | head -c 500
          exit 1
